# Boards to poll. One entry per company.
#
#   ats:   greenhouse | lever | ashby | recruitee | workable | smartrecruiters | personio
#   slug:  the company's board identifier (NOT its domain)
#   name:  whatever you want to see in the digest
#
# The slug is the identifier in the company's public careers URL:
#   https://boards.greenhouse.io/<slug>              -> ats: greenhouse
#   https://jobs.lever.co/<slug>                     -> ats: lever
#   https://jobs.ashbyhq.com/<slug>                  -> ats: ashby
#   https://<slug>.recruitee.com                     -> ats: recruitee
#   https://apply.workable.com/<slug>                -> ats: workable
#   https://jobs.smartrecruiters.com/<slug>          -> ats: smartrecruiters
#   https://<slug>.jobs.personio.com                 -> ats: personio
#
# THESE ARE EXAMPLES — verify each one before you trust the output. Companies
# migrate between ATS vendors and slugs go dead. Check a slug in your browser:
#   https://boards-api.greenhouse.io/v1/boards/<slug>/jobs?content=true
#   https://api.lever.co/v0/postings/<slug>?mode=json
#   https://api.ashbyhq.com/posting-api/job-board/<slug>?includeCompensation=true
#   https://<slug>.recruitee.com/api/offers/
#   https://apply.workable.com/api/v1/widget/accounts/<slug>?details=true
#   https://api.smartrecruiters.com/v1/companies/<slug>/postings
#   https://<slug>.jobs.personio.com/xml
#
# A dead slug is not fatal: fetch_board prints the HTTP status and returns [],
# so one bad entry never takes down the run. Watch the per-board job counts on
# stdout — a board reporting 0 jobs every day is a slug that needs fixing.
#
# NOTE on smartrecruiters: its list API has no job description, so each posting
# that survives the prefilter costs one extra request (see fetch.hydrate). A
# huge enterprise slug (e.g. BoschGroup, 4000+ roles) is fine but slower.
#
# LinkedIn / Naukri / Indeed are deliberately absent: none expose a free public
# API, and scraping them breaks their terms of service. This tool only talks to
# documented, unauthenticated ATS endpoints.
#
# Start with 10-15 companies you would actually join. A list of 200 is mostly
# noise and makes the prefilter counts impossible to reason about.

companies:
  - {ats: greenhouse, slug: stripe,      name: Stripe}
  - {ats: greenhouse, slug: databricks,  name: Databricks}
  - {ats: greenhouse, slug: cloudflare,  name: Cloudflare}
  - {ats: greenhouse, slug: figma,       name: Figma}
  - {ats: greenhouse, slug: dropbox,     name: Dropbox}
  - {ats: greenhouse, slug: coinbase,    name: Coinbase}
  - {ats: greenhouse, slug: reddit,      name: Reddit}
  - {ats: lever,      slug: voleon,      name: Voleon}

  - {ats: ashby,      slug: openai,      name: OpenAI}
  - {ats: ashby,      slug: ramp,        name: Ramp}
  - {ats: ashby,      slug: linear,      name: Linear}
  - {ats: ashby,      slug: vanta,       name: Vanta}

  # --- newer providers (verify the slug before trusting the output) ---
  # - {ats: recruitee,       slug: <slug>,       name: <Company>}
  # - {ats: workable,        slug: <slug>,       name: <Company>}
  # - {ats: smartrecruiters, slug: BoschGroup,   name: Bosch}
  # - {ats: personio,        slug: <slug>,       name: <Company>}
