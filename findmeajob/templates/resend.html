<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Me A Job - edit email</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 32px 20px; background: #0f1115; color: #e6e8ec; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .wrap { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 22px; }
    .card { background: #171a21; border: 1px solid #262b36; border-radius: 12px; padding: 20px; }
    label { display: block; margin: 14px 0 6px; font-weight: 700; font-size: 13px; }
    input, textarea { width: 100%; box-sizing: border-box; background: #0d1017; color: #e6e8ec; border: 1px solid #262b36; border-radius: 8px; padding: 10px; font: inherit; }
    textarea { min-height: 480px; font-family: Consolas, monospace; font-size: 12px; }
    button, a { display: inline-block; margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 8px; background: #7c9cff; color: #0f1115; font-weight: 800; text-decoration: none; cursor: pointer; }
    a { background: #2b3345; color: #e6e8ec; margin-left: 8px; }
    .msg { padding: 10px; margin-bottom: 14px; background: #1f8f4d; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Edit email before sending</h1>
    <div class="card">
      {% if message %}<div class="msg">{{ message }}</div>{% endif %}
      <form method="post">
        <label for="recipient">Recipient</label>
        <input id="recipient" name="recipient" type="email"
               value="{{ recipient }}" required>
        <label for="subject">Subject</label>
        <input id="subject" name="subject" value="{{ subject }}">
        <label for="body">HTML email body</label>
        <textarea id="body" name="body">{{ body }}</textarea>
        <button type="submit">Send email</button>
        <a href="{{ url_for('status', job_id=job_id) }}">Back to results</a>
      </form>
    </div>
  </div>
</body>
</html>
